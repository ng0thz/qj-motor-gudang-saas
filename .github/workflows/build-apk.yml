name: Build APK QJ Motor - Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Fix Gradle project (create android folder)
        run: |
          flutter create --platforms=android --project-name gudang_saas --org com.qjmotor.saas .
          # Restore our lib files (flutter create overwrites lib/main.dart)
          git checkout -- lib/main.dart lib/features/ lib/core/ pubspec.yaml || true
          flutter pub get

      - name: Install dependencies
        run: flutter pub get

      # Firebase Android BoM baru butuh minSdk 23; template lama masih 21.
      - name: Naikkan minSdk untuk Firebase BoM baru
        run: |
          sed -i -E "s/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/" android/app/build.gradle || true
          sed -i -E "s/minSdk = flutter\.minSdkVersion/minSdk = 23/" android/app/build.gradle || true
          grep -n "minSdk" android/app/build.gradle || true

      - name: Fix Gradle distributionUrl (hindari 404 github mirror)
        run: |
          sed -i "s|https://github.com/gradle/gradle-distributions.*|https\\://services.gradle.org/distributions/gradle-7.6.3-all.zip|" android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Generate ikon launcher QJ
        run: dart run flutter_launcher_icons

      - name: Build APK Release (QJ Motor)
        run: |
          for i in 1 2 3; do
            flutter build apk --release --dart-define=TENANT_ID=qj-motor && break
            echo "Build gagal percobaan $i, retry..."
            sleep 20
          done

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-release-qj-motor
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build AppBundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: appbundle-qj-motor
          path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Tambah folder web bila belum ada
        run: |
          flutter create --platforms=web --project-name gudang_saas --org com.qjmotor.saas .
          git checkout -- lib/main.dart lib/features/ lib/core/ pubspec.yaml || true
          flutter pub get

      - name: Build Web Release (Desktop)
        run: flutter build web --release --dart-define=TENANT_ID=qj-motor

      - name: Upload Web
        uses: actions/upload-artifact@v5
        with:
          name: web-qj-motor
          path: build/web
          retention-days: 30

      # Deploy otomatis ke Firebase Hosting bila secret tersedia.
      # Isi secret: repo Settings > Secrets > Actions > FIREBASE_SERVICE_ACCOUNT
      # (JSON service account role Firebase Hosting Admin; JANGAN pakai
      # serviceAccountKey.json utama bila bisa — buat khusus CI).
      # Tanpa secret: step dilewati, artifact web tetap bisa diunduh manual.
      - name: Deploy ke Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT belum diisi - lewati deploy."
            exit 0
          fi
          npm install -g firebase-tools
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only hosting --project gudang-saas-platform --non-interactive

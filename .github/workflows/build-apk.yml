name: Build APK QJ Motor - Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Fix Gradle project (create android folder)
        run: |
          flutter create --platforms=android --project-name gudang_saas --org com.qjmotor.saas .
          # Restore our lib files (flutter create overwrites lib/main.dart)
          git checkout -- lib/main.dart lib/features/ lib/core/ pubspec.yaml || true
          flutter pub get

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release (QJ Motor)
        run: flutter build apk --release --dart-define=TENANT_ID=qj-motor

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-qj-motor
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build AppBundle (Play Store)
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-qj-motor
          path: build/app/outputs/bundle/release/app-release.aab

name: gudang_saas
description: SaaS Sewa Gudang Sparepart 500 SKU - Multi Tenant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  cloud_functions: ^5.0.1
  mobile_scanner: ^5.2.0
  fl_chart: ^0.68.0
  provider: ^6.1.0
  google_fonts: ^6.1.0
  intl: ^0.19.0
  pdf: ^3.10.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  excel: ^4.0.0
  printing: ^5.12.0
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: false
  image_path: assets/qj_icon_512.png
  adaptive_icon_background: '#D92028'
  adaptive_icon_foreground: assets/qj_icon_512.png

flutter:
  uses-material-design: true
  assets:
    - assets/data_import.json
    - assets/data_import_classified.json
    - assets/qjmotor_logo_transparent.png
    - assets/adidaya_logo_transparent.png
    - assets/qj_logo_white.png
    - assets/qj_header_logo.png
    - assets/qj_header_logo_light.png
    - assets/qj_icon_512.png
    - assets/qj_icon_192.png
    - assets/qj_icon_maskable_512.png
    - assets/qjmotor_icon.png
